name: Nexus update release
# One release = client (this repo) + CWELBOT (bot repo), installed by one updater.
# Runs on a client push, on a bot push (repository_dispatch "bot-updated" sent by
# the bot repo) or by hand. Version numbers are assigned automatically.
on:
  push:
    branches: [main]
    paths: [client/**, studio/**, build/**, RELEASE.md, .github/workflows/release.yml]
  repository_dispatch:
    types: [bot-updated]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-release
  cancel-in-progress: false
env:
  BOT_REPOSITORY: ${{ vars.BOT_REPOSITORY || 'Secretivv/CWELBOT' }}
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Next version (vYYYY.MM.DD.N)
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $day = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          $n = 0
          foreach ($tag in $tags) {
            if ($tag -match "^v$([regex]::Escape($day))\.(\d+)$") { $n = [Math]::Max($n, [int]$Matches[1]) }
          }
          $version = "v$day.$($n + 1)"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Version $version"

      - name: Add CWELBOT to the package
        id: bot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}
        run: |
          $target = 'client/CWELBOT'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          if ($env:BOT_TOKEN) {
            git clone --depth 1 "https://x-access-token:$($env:BOT_TOKEN)@github.com/$($env:BOT_REPOSITORY).git" bot-src
            if ($LASTEXITCODE -ne 0) { throw "Cannot read $env:BOT_REPOSITORY (check BOT_REPO_TOKEN)." }
            New-Item -ItemType Directory -Path $target | Out-Null
            Get-ChildItem bot-src -Force | Where-Object { $_.Name -notin @('.git', '.github') } |
              Copy-Item -Destination $target -Recurse -Force
            $botVersion = if (Test-Path bot-src/VERSION) { (Get-Content bot-src/VERSION -Raw).Trim() } else { 'bez numeru' }
            $commit = (git -C bot-src log -1 --format='%h %s')
            $notes = if (Test-Path bot-src/RELEASE.md) { Get-Content bot-src/RELEASE.md -Raw } else { "Ostatnia zmiana: $commit" }
            $source = "repo $env:BOT_REPOSITORY"
          } else {
            # No access to the bot repo yet: ship the bot from the previous release unchanged.
            gh release download --repo $env:GITHUB_REPOSITORY --pattern nexus-update.zip --dir prev
            if ($LASTEXITCODE -ne 0) { throw 'No BOT_REPO_TOKEN and no previous release to take the bot from.' }
            Expand-Archive prev/nexus-update.zip -DestinationPath prev/pkg
            if (!(Test-Path prev/pkg/CWELBOT)) { throw 'Previous release has no CWELBOT.' }
            Copy-Item prev/pkg/CWELBOT -Destination $target -Recurse
            $botVersion = 'bez zmian'
            $notes = 'Bot bez zmian (wzięty z poprzedniego wydania).'
            $source = 'poprzednie wydanie'
          }
          $count = @(Get-ChildItem $target -Recurse -File).Count
          if ($count -eq 0) { throw 'CWELBOT is empty.' }
          Write-Output "CWELBOT $botVersion from $source ($count files)"
          "version=$botVersion" >> $env:GITHUB_OUTPUT
          Set-Content -Path bot-notes.md -Value $notes -Encoding utf8

      - name: Verify updater and build package
        shell: pwsh
        run: |
          ./build/Test-Update.ps1
          $version = '${{ steps.version.outputs.version }}'
          ./build/Build-Update.ps1 -ClientRoot ./client -Output ./dist -Version $version
          # Content hash of each part, so the updater installs only the part
          # that changed: a client release never resets the bot and the other way.
          $manifestPath = Resolve-Path dist/update.json
          $m = Get-Content $manifestPath -Raw | ConvertFrom-Json
          function Get-PartHash($entries) {
            $text = ($entries | Sort-Object { $_.path } -Culture '' | ForEach-Object { "$($_.path):$($_.sha256)" }) -join "`n"
            $sha = [Security.Cryptography.SHA256]::Create()
            try { [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($text))).Replace('-', '').ToLowerInvariant() } finally { $sha.Dispose() }
          }
          $botFiles = @($m.files | Where-Object { $_.path.StartsWith('CWELBOT/') })
          $clientFiles = @($m.files | Where-Object { -not $_.path.StartsWith('CWELBOT/') })
          $m | Add-Member -NotePropertyName clientHash -NotePropertyValue (Get-PartHash $clientFiles)
          $m | Add-Member -NotePropertyName botHash -NotePropertyValue (Get-PartHash $botFiles)
          [IO.File]::WriteAllText($manifestPath, ($m | ConvertTo-Json -Depth 6), [Text.UTF8Encoding]::new($false))
          Write-Output "client $($m.clientHash.Substring(0,12)) ($($clientFiles.Count) files), bot $($m.botHash.Substring(0,12)) ($($botFiles.Count) files)"
          Compress-Archive -Path ./client/URUCHOM_NEXUS.cmd,./client/updater -DestinationPath ./dist/nexus-launcher.zip
          Compress-Archive -Path ./studio/* -DestinationPath ./dist/nexus-studio-sync.zip

      - name: Small update since the previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # nexus-delta.zip holds only files changed since the latest release.
          # Clients on that release download it instead of the full package;
          # unchanged Nexus Client.exe/init.lua are marked "local" (copied from
          # the installation, the native installer runs from the staged EXE).
          . ./build/Update-Library.ps1
          Add-Type -AssemblyName System.IO.Compression,System.IO.Compression.FileSystem
          $previous = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or !$previous) { Write-Output 'No previous release; full package only.'; exit 0 }
          gh release download $previous --repo $env:GITHUB_REPOSITORY --pattern update.json --dir prevmeta
          if ($LASTEXITCODE -ne 0) { Write-Output 'Previous manifest missing; full package only.'; exit 0 }
          $old = @{}
          foreach ($f in (Get-Content prevmeta/update.json -Raw | ConvertFrom-Json).files) { $old[$f.path] = $f.sha256 }
          $new = Get-Content dist/update.json -Raw | ConvertFrom-Json
          $changed = @($new.files | Where-Object { $old[$_.path] -ne $_.sha256 })
          if ($changed.Count -eq 0) { Write-Output 'Nothing changed; full package only.'; exit 0 }
          $files = [System.Collections.Generic.List[object]]::new()
          foreach ($f in $changed) { $files.Add(@{ path = $f.path; size = $f.size; sha256 = $f.sha256 }) }
          foreach ($required in @('Nexus Client.exe', 'init.lua')) {
            if (!($changed | Where-Object path -eq $required)) {
              $entry = $new.files | Where-Object path -eq $required
              $files.Add(@{ path = $entry.path; size = $entry.size; sha256 = $entry.sha256; local = $true })
            }
          }
          $zip = Join-Path (Resolve-Path dist) 'nexus-delta.zip'
          $archive = [IO.Compression.ZipFile]::Open($zip, [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($f in $changed) {
              $null = [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, (Join-Path (Resolve-Path client) $f.path), $f.path, [IO.Compression.CompressionLevel]::Optimal)
            }
          } finally { $archive.Dispose() }
          $delta = @{ schema = 1; version = $new.version; from = $previous; sha256 = (Get-NexusSHA256 $zip); files = $files; clientHash = $new.clientHash; botHash = $new.botHash }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'delta.json'), ($delta | ConvertTo-Json -Depth 6), [Text.UTF8Encoding]::new($false))
          $kb = [Math]::Round((Get-Item $zip).Length / 1KB)
          Write-Output "Small update from $previous`: $($changed.Count) files, $kb KB"

      - name: Publish verified package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $bot = '${{ steps.bot.outputs.version }}'
          $trigger = if ('${{ github.event_name }}' -eq 'repository_dispatch') { 'aktualizacja bota' } else { 'aktualizacja klienta' }
          $client = Get-Content RELEASE.md -Raw
          $botNotes = Get-Content bot-notes.md -Raw
          $body = "Wydanie: $trigger`n`n## Klient`n`n$client`n`n## Bot CWELBOT ($bot)`n`n$botNotes"
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          $assets = @('./dist/nexus-update.zip', './dist/update.json', './dist/nexus-launcher.zip', './dist/nexus-studio-sync.zip')
          if ((Test-Path ./dist/nexus-delta.zip) -and (Test-Path ./dist/delta.json)) { $assets += @('./dist/nexus-delta.zip', './dist/delta.json') }
          gh release create $version @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Nexus Client $version" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
